<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2616"/><stop offset="52%" stop-color="#25150c"/><stop offset="100%" stop-color="#341f11"/>
    </linearGradient>
    <radialGradient id="curry" cx="40%" cy="34%">
      <stop offset="0%" stop-color="#e58330"/><stop offset="58%" stop-color="#c9551a"/><stop offset="100%" stop-color="#9c3a10"/>
    </radialGradient>
    <radialGradient id="chut" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#6f9450"/><stop offset="100%" stop-color="#41602c"/>
    </radialGradient>
    <radialGradient id="warmlight" cx="34%" cy="24%" r="70%">
      <stop offset="0%" stop-color="#ffce92" stop-opacity=".30"/><stop offset="100%" stop-color="#ffce92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="50%" cy="46%" r="70%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#wood)"/>
  <g stroke="#000" stroke-opacity=".16">
    <line x1="0" y1="96" x2="400" y2="96"/><line x1="0" y1="212" x2="400" y2="212"/><line x1="0" y1="326" x2="400" y2="326"/>
  </g>
  <rect width="400" height="400" fill="url(#warmlight)"/>

  <!-- main curry plate -->
  <circle cx="196" cy="206" r="104" fill="#0d0805" opacity=".45"/>
  <circle cx="192" cy="200" r="104" fill="#ece2d2"/>
  <circle cx="192" cy="200" r="92" fill="#ddd0bc"/>
  <circle cx="192" cy="200" r="80" fill="url(#curry)"/>
  <g fill="#8f3410" opacity=".5">
    <ellipse cx="164" cy="180" rx="19" ry="14"/><ellipse cx="214" cy="216" rx="17" ry="12"/>
    <ellipse cx="206" cy="166" rx="14" ry="10"/><ellipse cx="160" cy="226" rx="13" ry="9"/>
  </g>
  <path d="M148 190c22-14 44-2 52 12s34 20 52 6" fill="none" stroke="#f7e8cd" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <g fill="#3f6b2e" opacity=".85">
    <ellipse cx="176" cy="238" rx="6" ry="4"/><ellipse cx="228" cy="184" rx="5" ry="3.4"/><ellipse cx="196" cy="152" rx="5" ry="3.4"/>
  </g>

  <!-- rice bowl -->
  <circle cx="62" cy="74" r="50" fill="#0d0805" opacity=".4"/>
  <circle cx="58" cy="70" r="50" fill="#e7dccb"/>
  <circle cx="58" cy="70" r="40" fill="#f6f1e6"/>
  <g fill="#ddd2bd"><ellipse cx="46" cy="60" rx="9" ry="5"/><ellipse cx="70" cy="78" rx="8" ry="4.5"/><ellipse cx="60" cy="86" rx="7" ry="4"/></g>

  <!-- naan -->
  <g transform="rotate(-18 320 88)">
    <ellipse cx="320" cy="88" rx="62" ry="44" fill="#0d0805" opacity=".38"/>
    <ellipse cx="316" cy="84" rx="62" ry="44" fill="#e9cfa1"/>
    <ellipse cx="300" cy="72" rx="14" ry="9" fill="#c9a066" opacity=".7"/>
    <ellipse cx="336" cy="96" rx="11" ry="7" fill="#c9a066" opacity=".6"/>
    <ellipse cx="330" cy="66" rx="8" ry="5" fill="#a97c44" opacity=".5"/>
  </g>

  <!-- chutneys -->
  <circle cx="332" cy="288" r="34" fill="#0d0805" opacity=".4"/>
  <circle cx="328" cy="284" r="34" fill="#e7dccb"/>
  <circle cx="328" cy="284" r="25" fill="url(#chut)"/>
  <circle cx="86" cy="312" r="30" fill="#0d0805" opacity=".4"/>
  <circle cx="82" cy="308" r="30" fill="#e7dccb"/>
  <circle cx="82" cy="308" r="22" fill="#a8321a"/>

  <!-- cutlery -->
  <g fill="#cdbb9c" opacity=".5">
    <rect x="368" y="176" width="6" height="86" rx="3"/>
    <rect x="382" y="176" width="6" height="86" rx="3"/>
  </g>
  <rect width="400" height="400" fill="url(#vig2)"/>
